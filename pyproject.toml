[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersec-env"
version = "0.1.0"
description = "An OpenEnv RL environment for training LLMs to repair insecure code (RLVR, verifiable security rewards)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CyberSec Env contributors" }]
keywords = ["rl-environment", "openenv", "llm", "grpo", "security", "rlvr", "trl"]

dependencies = [
    "openenv>=0.9.0",
    "pydantic>=2",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
train = [
    "trl>=1.16",
    "transformers>=5",
    "peft>=0.21",
    "accelerate>=1",
    "datasets>=3",
    "torch>=2.4",
    "matplotlib>=3.7",
]
audit = ["bandit>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
cybersec-env-server = "cybersec_env.server.app:main"

[tool.setuptools]
packages = ["cybersec_env", "cybersec_env.tasks", "cybersec_env.server"]

[tool.setuptools.package-data]
cybersec_env = ["py.typed", "data/imported/*.jsonl", "data/imported/*.md"]

[tool.pytest.ini_options]
markers = [
    "functionality: functional correctness probe",
    "security: exploit / security probe",
]
