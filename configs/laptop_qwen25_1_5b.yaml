# Larger laptop profile: Qwen2.5-1.5B-Instruct with LoRA. Heavier than the
# 0.5B profile; if you hit OOM on 8 GB, set load_in_4bit: true (needs
# bitsandbytes) or lower num_generations / max_completion_length.
#
#   python scripts/train_grpo.py --config configs/laptop_qwen25_1_5b.yaml

model: Qwen/Qwen2.5-1.5B-Instruct
dtype: bfloat16
load_in_4bit: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  n_train_per_family: 48
  n_test_per_family: 16
  difficulties: [1]
  families: null

reward:
  mode: shaped
  timeout_s: 8
  max_workers: 8

grpo:
  output_dir: runs/qwen25_1_5b
  num_generations: 6
  per_device_train_batch_size: 6
  gradient_accumulation_steps: 2
  max_completion_length: 384
  learning_rate: 2.0e-6
  warmup_steps: 25
  max_grad_norm: 0.5
  max_steps: 250
  logging_steps: 2
  save_steps: 125
  temperature: 1.0
  beta: 0.04
  scale_rewards: group
  bf16: true
  gradient_checkpointing: true
  use_vllm: false
  report_to: none

eval:
  before_after: true
  k: 4
  max_new_tokens: 384
  temperature: 0.7
